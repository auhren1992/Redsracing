<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏁 Racing Fan Dashboard - RedsRacing</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/tailwind.css" />
  <link rel="stylesheet" href="../styles/main.css" />
  <link rel="stylesheet" href="../styles/input-fix.css" />
  <link rel="stylesheet" href="../styles/modern-nav.css" />
  <link rel="stylesheet" href="../styles/modern-effects.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root{--ac:#fbbf24;--ac2:#fde047;--ac3:#f59e0b;--dim:#fbbf241f;--mid:#fbbf2459;--bg:#fbbf240a}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;color:#fff;min-height:100vh;display:flex;flex-direction:column}
    .badge{display:inline-flex;align-items:center;gap:.3rem;padding:.15rem .5rem;border-radius:2rem;font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--dim);background:var(--bg);color:var(--ac)}
    .tabs{display:flex;overflow-x:auto;gap:.25rem;padding:.4rem .75rem;background:rgba(10,14,23,.8);border-bottom:1px solid rgba(255,255,255,.04);-webkit-overflow-scrolling:touch}
    .tabs::-webkit-scrollbar{display:none}
    .tb{display:flex;align-items:center;gap:.35rem;padding:.4rem .7rem;border-radius:2rem;border:1px solid transparent;background:transparent;color:rgba(255,255,255,.5);font-size:.72rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s}
    .tb:hover{color:var(--ac);background:var(--bg)}
    .tb.act{background:var(--bg);color:var(--ac);border-color:var(--dim)}
    .tb i{font-size:.7rem}
    main{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:1.25rem}
    .pn{animation:fi .3s ease}
    .hid{display:none!important}
    @keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    h2{font-family:'Racing Sans One',cursive;font-size:clamp(1.2rem,3vw,1.8rem);background:linear-gradient(45deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:1rem;text-transform:uppercase;letter-spacing:.04em}
    .card{background:rgba(15,23,42,.5);border:1px solid var(--dim);border-radius:.8rem;padding:1.1rem;margin-bottom:.75rem;transition:all .25s}
    .card:hover{border-color:var(--mid);transform:translateY(-2px)}
    .card-t{font-family:'Racing Sans One',cursive;color:var(--ac);font-size:.95rem;text-transform:uppercase;margin-bottom:.6rem;display:flex;align-items:center;gap:.5rem}
    .card-t i{font-size:.85rem}
    .ql{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;background:var(--bg);border:1px solid var(--dim);border-radius:.5rem;color:#fff;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:.4rem;text-decoration:none}
    .ql:hover{background:rgba(255,255,255,.03);border-color:var(--mid);transform:translateX(2px)}
    .qi{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:linear-gradient(45deg,var(--ac),var(--ac3));border-radius:.4rem;font-size:.8rem;color:#0a0e17;flex-shrink:0}
    .cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:.6rem 0}
    .ci{text-align:center;background:var(--bg);border:1px solid var(--dim);border-radius:.5rem;padding:.5rem .1rem}
    .cn{font-family:'Racing Sans One',cursive;font-size:1.5rem;color:var(--ac);line-height:1}
    .cl{font-size:.5rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-top:.1rem}
    .race{display:flex;justify-content:space-between;align-items:center;padding:.7rem .9rem;background:rgba(15,23,42,.4);border:1px solid var(--dim);border-radius:.6rem;margin-bottom:.5rem;transition:all .2s}
    .race:hover{border-color:var(--mid)}
    .race.past{opacity:.45}
    .rdate{color:var(--ac);font-weight:700;font-size:.8rem;min-width:70px}
    .rname{font-weight:700;font-size:.85rem}.rtrack{color:rgba(255,255,255,.4);font-size:.7rem}
    .st{font-size:.6rem;font-weight:700;padding:.15rem .5rem;border-radius:1rem;text-transform:uppercase}
    .st.up{background:rgba(34,197,94,.12);color:#22c55e}.st.dn{background:rgba(100,116,139,.12);color:#94a3b8}
    .ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.75rem}
    .gimg{border-radius:.6rem;overflow:hidden;border:1px solid var(--dim);aspect-ratio:4/3;background:#1e293b;cursor:pointer;transition:all .2s}
    .gimg:hover{border-color:var(--mid);transform:scale(1.02)}
    .gimg img{width:100%;height:100%;object-fit:cover}
    .vid{background:rgba(15,23,42,.4);border:1px solid var(--dim);border-radius:.6rem;overflow:hidden;margin-bottom:.75rem}
    .vid iframe{width:100%;aspect-ratio:16/9;border:none}
    .vid .vt{padding:.5rem .7rem;font-weight:700;font-size:.8rem}
    textarea,select{background:#1e293b;border:1px solid var(--dim);color:#fff;padding:.5rem;border-radius:.4rem;font-size:.8rem;width:100%;font-family:inherit}
    textarea{resize:none}
    .btn{background:linear-gradient(45deg,var(--ac),var(--ac3));color:#0a0e17;padding:.45rem 1.2rem;border:none;border-radius:.4rem;font-weight:700;cursor:pointer;font-size:.8rem}
    .msg{font-size:.75rem;margin-top:.3rem}
    .stat{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1rem}
    .stat-i{background:var(--bg);border:1px solid var(--dim);border-radius:.5rem;padding:.6rem;font-size:.75rem}
    .stat-i .v{font-family:'Racing Sans One',cursive;font-size:1.3rem;color:var(--ac)}
    .stat-i .l{color:rgba(255,255,255,.4);font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;margin-top:.1rem}
    .ldg{text-align:center;padding:2rem;color:rgba(255,255,255,.3)}
    .home-grid{display:grid;grid-template-columns:1fr;gap:1rem;margin-top:.15rem}
    @media(min-width:900px){.home-grid{grid-template-columns:1.12fr .88fr;align-items:start}}
    .hi{font-size:clamp(1rem,2.8vw,1.25rem);font-weight:800;color:#fff;line-height:1.25;margin-bottom:.35rem}
    .sub{color:rgba(255,255,255,.45);font-size:.78rem;line-height:1.5;margin-bottom:1rem;max-width:42rem}
    .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
    @media(min-width:520px){.quick-grid{grid-template-columns:repeat(3,1fr)}}
    .qlk{display:flex;align-items:center;gap:.45rem;padding:.5rem .55rem;background:var(--bg);border:1px solid var(--dim);border-radius:.5rem;color:#fff;font-size:.72rem;font-weight:600;text-decoration:none;transition:all .2s}
    .qlk:hover{border-color:var(--mid);transform:translateY(-1px);color:var(--ac2)}
    .qlk i{width:1.1rem;text-align:center;color:var(--ac)}
    .bul{margin:0;padding-left:1.1rem;color:rgba(255,255,255,.52);font-size:.78rem;line-height:1.55}
    .bul li{margin-bottom:.35rem}
    .st-wrap{overflow-x:auto;border-radius:.6rem;border:1px solid var(--dim)}
    .st-table{width:100%;border-collapse:collapse;font-size:.76rem}
    .st-table th{text-align:left;color:var(--ac);padding:.45rem .5rem;background:rgba(10,14,23,.6);font-weight:700;text-transform:uppercase;font-size:.62rem;letter-spacing:.04em}
    .st-table td{padding:.45rem .5rem;border-top:1px solid rgba(255,255,255,.06)}
    .st-muted{color:rgba(255,255,255,.35);font-size:.72rem}
    .potw{display:flex;gap:.75rem;align-items:flex-start;margin-top:.35rem}
    .potw img{width:108px;height:108px;object-fit:cover;border-radius:.55rem;border:1px solid var(--dim);flex-shrink:0;background:#1e293b}
    @media(max-width:640px){.cgrid{grid-template-columns:repeat(2,1fr)}.cn{font-size:1.2rem}.ggrid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body class="bg-dark-blue">
  <div id="rr-role-hub-nav-mount"></div>
  <script src="../assets/js/role-hub-shell.js" data-hub="fan" data-root=".."></script>
  <div class="sm:hidden px-3 py-2 border-b border-slate-800/80 bg-black/25 flex justify-center">
    <span class="badge"><i class="fas fa-flag-checkered"></i> Racing Fan</span>
  </div>
  <div class="px-3 md:px-0 mt-2 mb-1 w-full max-w-[1100px] mx-auto">
    <div id="rr-feature-strip"></div>
  </div>
  <script type="module" src="../assets/js/featured-strip.js"></script>
  <div class="tabs"><button onclick="showTab('home')" id="tb-home" class="tb act"><i class="fas fa-home"></i><span>Home</span></button><button onclick="showTab('schedule')" id="tb-schedule" class="tb"><i class="fas fa-calendar-alt"></i><span>Schedule</span></button><button onclick="showTab('gallery')" id="tb-gallery" class="tb"><i class="fas fa-images"></i><span>Gallery</span></button><button onclick="showTab('videos')" id="tb-videos" class="tb"><i class="fas fa-play-circle"></i><span>Videos</span></button><button onclick="showTab('standings')" id="tb-standings" class="tb"><i class="fas fa-trophy"></i><span>Standings</span></button><button onclick="showTab('fanwall')" id="tb-fanwall" class="tb"><i class="fas fa-bullhorn"></i><span>Fan Wall</span></button><button onclick="showTab('drivers')" id="tb-drivers" class="tb"><i class="fas fa-users"></i><span>Drivers</span></button><button onclick="showTab('profile')" id="tb-profile" class="tb"><i class="fas fa-id-card"></i><span>Profile</span></button></div>
  <main>
    <div id="ld" class="ldg"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
    <div id="content" class="hid">
      <div id="pn-home" class="pn"></div>
          <div id="pn-schedule" class="pn hid"></div>
          <div id="pn-gallery" class="pn hid"></div>
          <div id="pn-videos" class="pn hid"></div>
          <div id="pn-standings" class="pn hid"></div>
          <div id="pn-fanwall" class="pn hid"></div>
          <div id="pn-drivers" class="pn hid"></div>
          <div id="pn-profile" class="pn hid"></div>
    </div>
  </main>
  <script>
    firebase.initializeApp({apiKey:"AIzaSyARFiFCadGKFUc_s6x3qNX8F4jsVawkzVg",authDomain:"redsracing-a7f8b.firebaseapp.com",projectId:"redsracing-a7f8b",storageBucket:"redsracing-a7f8b.firebasestorage.app",messagingSenderId:"517034606151",appId:"1:517034606151:web:24cae262e1d98832757b62"});
    var au=firebase.auth(),db=firebase.firestore();

    function escHtml(s){
      return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showTab(id){
      document.querySelectorAll('.pn').forEach(function(p){p.classList.add('hid');});
      document.querySelectorAll('.tb').forEach(function(b){b.classList.remove('act');});
      var pn=document.getElementById('pn-'+id);if(pn){pn.classList.remove('hid');pn.style.animation='none';pn.offsetHeight;pn.style.animation='';}
      var tb=document.getElementById('tb-'+id);if(tb)tb.classList.add('act');
      // Lazy load content
      if(!pn.dataset.loaded){pn.dataset.loaded='1';loadSection(id);}
    }

    async function loadSection(id){
      var pn=document.getElementById('pn-'+id);
      if(id==='home') loadHome(pn);
      else if(id==='schedule') loadSchedule(pn);
      else if(id==='gallery') loadGallery(pn);
      else if(id==='videos') loadVideos(pn);
      else if(id==='standings') loadStandings(pn);
      else if(id==='fanwall') loadFanWall(pn);
      else if(id==='drivers') loadDrivers(pn);
      else if(id==='profile') loadProfile(pn);
    }

    // ---- HOME ----
    async function loadHome(el){
      var u=au.currentUser;
      var ud={};
      try{var us=await db.collection('users').doc(u.uid).get();if(us.exists)ud=us.data()||{};}catch(_){}
      var first=((ud.displayName||u.displayName||((u.email||'').split('@')[0])||'Fan').trim().split(/\s+/)[0]);
      var pts=typeof ud.totalPoints==='number'?ud.totalPoints:0;
      var ach=typeof ud.achievementCount==='number'?ud.achievementCount:0;
      var predCount=0;
      try{
        var pq=await db.collection('predictions').where('userId','==',u.uid).get();
        predCount=pq.size;
        if(predCount===0){var pq2=await db.collection('predictions').where('uid','==',u.uid).get();predCount=pq2.size;}
      }catch(_){}

      el.innerHTML=
        '<div class="home-grid">'+
          '<div class="home-left">'+
            '<div class="hi" id="hm-greet">Hey '+escHtml(first)+' — this is your fan hub</div>'+
            '<p class="sub" id="hm-sub">Count down to the next race, browse highlights, post on the Fan Wall, and open the full RedsRacing site whenever you want the big experience.</p>'+
            '<div class="card"><div class="card-t"><i class="fas fa-flag-checkered"></i>Next race</div><div id="rn" style="font-weight:700"></div><div id="rt" style="color:rgba(255,255,255,.4);font-size:.8rem"></div><div id="cdg" class="cgrid"><div class="ci"><div id="d0" class="cn">0</div><div class="cl">Days</div></div><div class="ci"><div id="d1" class="cn">0</div><div class="cl">Hrs</div></div><div class="ci"><div id="d2" class="cn">0</div><div class="cl">Min</div></div><div class="ci"><div id="d3" class="cn">0</div><div class="cl">Sec</div></div></div></div>'+
            '<div class="card" id="hm-season"><div class="card-t"><i class="fas fa-chart-line"></i>2026 season snapshot</div><div id="hm-seas-body" class="st-muted">Loading…</div></div>'+
            '<div class="card hid" id="hm-last"><div class="card-t"><i class="fas fa-history"></i>Last time out</div><div id="hm-last-body"></div></div>'+
            '<div class="card hid" id="hm-potw"><div class="card-t"><i class="fas fa-star"></i>Photo of the week</div><div id="hm-potw-body"></div></div>'+
          '</div>'+
          '<div class="home-right">'+
            '<div class="card"><div class="card-t"><i class="fas fa-fire"></i>Your fan stats</div><div class="stat" style="margin-bottom:.5rem">'+
              '<div class="stat-i"><div class="v" id="hm-pts">'+pts+'</div><div class="l">Fan points</div></div>'+
              '<div class="stat-i"><div class="v" id="hm-ach">'+ach+'</div><div class="l">Achievements</div></div>'+
              '<div class="stat-i"><div class="v" id="hm-pr">'+predCount+'</div><div class="l">Predictions</div></div>'+
              '<div class="stat-i"><div class="v" id="hm-upc">—</div><div class="l">Races left</div></div>'+
            '</div><p class="st-muted" style="margin:0 0 .5rem">Earn points from site achievements. Submit race predictions and cheer on the team on the Fan Wall.</p>'+
            '<a class="ql" href="../predictions.html" style="margin-bottom:.35rem"><span class="qi"><i class="fas fa-dice"></i></span><span>Make a prediction</span></a>'+
            '<a class="ql" href="../leaderboard.html"><span class="qi"><i class="fas fa-medal"></i></span><span>Open fan leaderboard</span></a></div>'+
            '<div class="card"><div class="card-t"><i class="fas fa-compass"></i>Explore RedsRacing</div><div class="quick-grid">'+
              '<a class="qlk" href="../index.html"><i class="fas fa-home"></i><span>Home</span></a>'+
              '<a class="qlk" href="../schedule.html"><i class="fas fa-calendar-alt"></i><span>Schedule</span></a>'+
              '<a class="qlk" href="../leaderboard.html"><i class="fas fa-ranking-star"></i><span>Leaderboard</span></a>'+
              '<a class="qlk" href="../gallery.html"><i class="fas fa-images"></i><span>Gallery</span></a>'+
              '<a class="qlk" href="../videos.html"><i class="fas fa-play"></i><span>Videos</span></a>'+
              '<a class="qlk" href="../qna.html"><i class="fas fa-question-circle"></i><span>Q&amp;A</span></a>'+
              '<a class="qlk" href="../predictions.html"><i class="fas fa-bolt"></i><span>Predictions</span></a>'+
              '<a class="qlk" href="../sponsorship.html"><i class="fas fa-handshake"></i><span>Sponsors</span></a>'+
              '<a class="qlk" href="../feedback.html"><i class="fas fa-comment-dots"></i><span>Feedback</span></a>'+
              '<a class="qlk" href="../fan-settings.html"><i class="fas fa-sliders-h"></i><span>Fan settings</span></a>'+
              '<a class="qlk" href="../profile.html"><i class="fas fa-user"></i><span>Full profile</span></a>'+
            '</div></div>'+
            '<div class="card"><div class="card-t"><i class="fas fa-lightbulb"></i>Fan playbook</div><ul class="bul">'+
              '<li>Use <strong>Schedule</strong> for the full calendar; this hub keeps the same data in a tighter view.</li>'+
              '<li><strong>Fan Wall</strong> posts are moderated — keep it positive and family-friendly.</li>'+
              '<li><strong>Predictions</strong> let you pick finishes before race day; check the leaderboard to see how you rank.</li>'+
              '<li>Tap <strong>Drivers</strong> for bios, social links, and a peek at recent races and photos.</li>'+
            '</ul></div>'+
          '</div></div>';

      try{
        var t=new Date();t.setHours(0,0,0,0);
        var s=await db.collection('races').where('season','==',2026).orderBy('date','asc').get();
        var nr=null,lastPast=null,total=0,upcoming=0;
        s.forEach(function(d){
          var r=d.data();total++;
          if(!r.date)return;
          var rd=new Date(r.date+'T00:00:00');
          if(rd>=t){upcoming++;if(!nr)nr=r;}
          else{if(!lastPast||rd>new Date(lastPast.date+'T00:00:00'))lastPast={data:r,date:r.date};}
        });
        var seasEl=document.getElementById('hm-seas-body');
        if(seasEl)seasEl.innerHTML='<span style="color:rgba(255,255,255,.75)">'+total+'</span> races on the calendar · <span style="color:rgba(255,255,255,.75)">'+upcoming+'</span> still ahead';
        var upc=document.getElementById('hm-upc');if(upc)upc.textContent=String(upcoming);
        if(nr){
          document.getElementById('rn').textContent=nr.name||nr.eventName||'Upcoming race';
          document.getElementById('rt').textContent=(nr.track||'')+(nr.city?' — '+nr.city+', '+nr.state:'');
          var rd=new Date(nr.date+'T19:00:00').getTime();
          setInterval(function(){
            var d=rd-Date.now();if(d<0)return;
            var e0=document.getElementById('d0'),e1=document.getElementById('d1'),e2=document.getElementById('d2'),e3=document.getElementById('d3');
            if(!e0)return;
            e0.textContent=Math.floor(d/864e5);e1.textContent=Math.floor((d%864e5)/36e5);e2.textContent=Math.floor((d%36e5)/6e4);e3.textContent=Math.floor((d%6e4)/1e3);
          },1000);
        }else{
          document.getElementById('rn').textContent='Off-season or schedule updating';
          document.getElementById('rt').textContent='Check the Schedule tab or full site for news.';
          document.getElementById('cdg').innerHTML='<div style="grid-column:1/-1;color:rgba(255,255,255,.4);font-size:.8rem;font-style:italic">We will fire the countdown back up when the next date drops.</div>';
        }
        if(lastPast&&lastPast.data){
          document.getElementById('hm-last').classList.remove('hid');
          var lp=lastPast.data;
          document.getElementById('hm-last-body').innerHTML='<div style="font-weight:700;font-size:.9rem">'+(lp.eventName||lp.name||'Race')+'</div><div class="st-muted" style="margin-top:.25rem">'+(lp.track||'')+' · '+escHtml(lastPast.date)+'</div><p class="st-muted" style="margin:.5rem 0 0">Relive photos and videos in the tabs above, or open the <a href="../gallery.html" style="color:var(--ac)">full gallery</a>.</p>';
        }
      }catch(e){console.error(e);}

      try{
        var pw=await db.collection('config').doc('photo_of_the_week').get();
        if(pw.exists){
          var P=pw.data()||{};var cap=P.caption||'';
          var gid=P.imageId||'';
          if(gid){
            var gs=await db.collection('gallery_images').doc(gid).get();
            if(gs.exists){
              var G=gs.data()||{};var url=G.imageUrl||G.downloadURL;
              if(url){
                document.getElementById('hm-potw').classList.remove('hid');
                document.getElementById('hm-potw-body').innerHTML='<div class="potw"><img src="'+escHtml(url)+'" alt=""><div><div style="font-weight:700;font-size:.85rem;margin-bottom:.25rem">Pinned by the team</div><div class="st-muted">'+(cap?escHtml(cap):'Featured shot from the track.')+'</div><a class="ql" style="margin-top:.55rem" href="../gallery.html"><span class="qi"><i class="fas fa-images"></i></span><span>Browse all photos</span></a></div></div>';
              }
            }
          }
        }
      }catch(_){}
    }

    // ---- SCHEDULE ----
    async function loadSchedule(el){
      el.innerHTML='<h2><i class="fas fa-calendar-alt" style="margin-right:.4rem"></i>2026 Schedule</h2><div id="slist"><div class="ldg"><i class="fas fa-spinner fa-spin"></i></div></div>';

    // ---- STANDINGS ----
    async function loadStandings(el){
      el.innerHTML='<h2><i class="fas fa-trophy" style="margin-right:.4rem"></i>Driver standings</h2><p class="sub" style="margin-top:-.25rem">Points are summed from published <strong>race results</strong> for the current season when that data exists. Older or partial results may still appear while the team catches up on entry.</p><div id="stbody"><div class="ldg"><i class="fas fa-spinner fa-spin"></i></div></div>';
      try{
        var sn=await db.collection('race_results').get();
        var rows=[];sn.forEach(function(d){rows.push(d.data()||{});});
        function in2026(r){
          if(r.season===2026||r.season==='2026')return true;
          var rd=String(r.raceDate||r.date||'');
          if(rd.indexOf('2026')===0)return true;
          var id=String(r.raceId||'');
          if(id.indexOf('2026')!==-1)return true;
          return false;
        }
        var filtered=rows.filter(in2026);
        if(filtered.length===0)filtered=rows;
        var map={};
        filtered.forEach(function(r){
          var id=String(r.driverId||r.driverName||'driver').trim()||'driver';
          var label=r.driverName||r.driverId||'Driver';
          if(!map[id])map[id]={label:String(label),pts:0,wins:0,n:0};
          var p=typeof r.points==='number'?r.points:null;
          if(p==null||isNaN(p)){
            var fp=typeof r.finishPosition==='number'?r.finishPosition:parseInt(r.finishPosition,10);
            p=!isNaN(fp)&&fp>0?Math.max(0,32-fp):0;
          }
          map[id].pts+=p;map[id].n+=1;
          var pos=typeof r.finishPosition==='number'?r.finishPosition:parseInt(r.finishPosition,10);
          if(pos===1)map[id].wins+=1;
        });
        var list=Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){return b.pts-a.pts;});
        var box=document.getElementById('stbody');
        if(!list.length){box.innerHTML='<div class="card"><p class="st-muted" style="margin:0">No race results in Firestore yet. When the team posts finishes, this table fills in automatically.</p></div>';return;}
        var tb='<div class="st-wrap"><table class="st-table"><thead><tr><th>#</th><th>Driver</th><th>Pts</th><th>Wins</th><th>Races</th></tr></thead><tbody>';
        list.forEach(function(r,i){
          tb+='<tr><td>'+(i+1)+'</td><td>'+escHtml(r.label)+'</td><td style="color:var(--ac);font-weight:800">'+r.pts+'</td><td>'+r.wins+'</td><td class="st-muted">'+r.n+'</td></tr>';
        });
        tb+='</tbody></table></div>';
        box.innerHTML=tb;
      }catch(e){
        document.getElementById('stbody').innerHTML='<div class="card"><p class="st-muted" style="margin:0">Could not load standings ('+escHtml(e.message||'error')+').</p></div>';
      }
    }
