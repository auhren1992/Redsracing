org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# IMPORTANT: do NOT pin `org.gradle.java.home` in this file. CI runs on
# Ubuntu and gets its JDK from actions/setup-java (via JAVA_HOME); a
# Windows-specific path here would abort every CI build during config
# evaluation in ~5 seconds.
#
# If you want a project-local JDK on your own machine, set it in your
# user-global ~/.gradle/gradle.properties (NOT here):
#   org.gradle.java.home=C:\\Users\\<you>\\.jdks\\jdk-17.x.x
org.gradle.java.installations.auto-download=true
android.suppressUnsupportedCompileSdk=36

# Signing properties - REPLACE WITH YOUR ACTUAL PASSWORDS IN LOCAL VERSION
REDSRACING_KEYSTORE_PASSWORD=redsracing2025
REDSRACING_KEY_PASSWORD=redsracing2025
