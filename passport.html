<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fan Passport — RedsRacing</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="styles/tailwind.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/modern-nav.css" />
  <link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    body{background:linear-gradient(135deg,#020306 0%,#0a1228 100%);min-height:100vh;font-family:'Inter',sans-serif;color:#e2e8f0}
    .card{background:rgba(10,18,40,.9);border:1px solid rgba(251,191,36,.3);border-radius:16px;padding:2rem;max-width:480px;width:92%;text-align:center;margin:1.5rem auto}
    .album-wrap{max-width:920px;width:94%;margin:0 auto 2.5rem}
    .stamp-icon{font-size:3.5rem;margin-bottom:1rem}
    h1{font-family:'Racing Sans One',sans-serif;color:#fbbf24;font-size:2rem;margin-bottom:.5rem}
    .sub{color:#94a3b8;margin-bottom:1.5rem;font-size:.9rem}
    .btn-check{background:#fbbf24;color:#000;font-weight:700;padding:.75rem 2rem;border:none;border-radius:10px;font-size:1rem;cursor:pointer;width:100%;transition:background .2s;display:inline-block;text-decoration:none}
    .btn-check:hover{background:#facc15}
    .result{margin-top:1rem;font-size:.95rem;padding:.75rem;border-radius:8px}
    .result.success{background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.3);color:#4ade80}
    .result.error{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:#f87171}
    .result.info{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2);color:#fbbf24}
    .stamp-count{margin-top:1.5rem;color:#64748b;font-size:.82rem}
    .album-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.75rem;margin-top:1rem}
    .stamp-tile{background:rgba(15,23,42,.7);border:1px solid rgba(251,191,36,.22);border-radius:12px;padding:1rem .8rem;text-align:center;min-height:140px;display:flex;flex-direction:column;justify-content:center}
    .stamp-tile.earned{border-color:rgba(251,191,36,.55);box-shadow:0 0 0 1px rgba(251,191,36,.12)}
    .stamp-tile .ico{font-size:1.8rem;margin-bottom:.45rem}
    .stamp-tile .name{font-size:.82rem;font-weight:700;color:#fff}
    .stamp-tile .meta{font-size:.68rem;color:#64748b;margin-top:.25rem}
    .badge-row{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:.75rem 0 0}
    .badge{font-size:.65rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:.25rem .55rem;border-radius:999px;border:1px solid rgba(251,191,36,.3);color:#fbbf24;background:rgba(251,191,36,.08)}
  </style>
</head>
<body>
  <div id="navigation-placeholder"></div>

  <section class="rr-hero" style="margin-top:70px">
    <div class="rr-hero__inner container mx-auto px-4 py-10 md:py-14 text-center">
      <div class="rr-hero-kicker mx-auto mb-5"><i class="fas fa-passport"></i><span>Race night check-in</span></div>
      <h1 class="rr-hero-title text-4xl md:text-5xl text-white mb-3">FAN <span class="rr-title-gold">PASSPORT</span></h1>
      <p class="rr-hero-sub text-lg mb-6">Scan. Stamp. Collect the season.</p>
      <div class="rr-hero-actions">
        <a class="rr-pill rr-pill--primary" href="schedule.html"><i class="fas fa-calendar"></i><span>Race schedule</span></a>
        <a class="rr-pill" href="fan/dashboard.html"><i class="fas fa-tachometer-alt"></i><span>Fan hub</span></a>
      </div>
    </div>
  </section>

  <div class="card" id="checkin-card">
    <div class="stamp-icon">🏁</div>
    <h1>Check In</h1>
    <p class="sub" id="race-name">Finding next race…</p>
    <div id="checkin-area" style="display:none;">
      <button class="btn-check" id="checkin-btn"><i class="fas fa-passport"></i> Stamp My Passport!</button>
    </div>
    <div id="signin-prompt" style="display:none;">
      <p class="sub">Sign in to collect stamps and unlock fan badges.</p>
      <a href="login.html?returnTo=passport.html" class="btn-check" style="padding:.6rem 1.5rem;">Sign In</a>
    </div>
    <div id="result-area"></div>
    <div class="stamp-count" id="stamp-count"></div>
  </div>

  <div class="album-wrap">
    <div class="card" style="max-width:none;text-align:left">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.25rem">
        <div>
          <div class="rr-section-kicker" style="margin-bottom:.5rem"><i class="fas fa-stamp"></i><span>Your album</span></div>
          <h2 style="font-family:'Racing Sans One',sans-serif;color:#fff;font-size:1.6rem;margin:0">Stamp Album</h2>
          <p class="sub" style="margin:0.35rem 0 0">One stamp per race. Scan the team QR on race night.</p>
        </div>
        <div class="badge-row" id="badge-row"></div>
      </div>
      <div id="album-grid" class="album-grid"><div class="sub">Sign in to see your stamps.</div></div>
    </div>
  </div>

  <script type="module" src="navigation.js"></script>
  <script>
  if(!firebase.apps.length) firebase.initializeApp({
    apiKey:"AIzaSyARFiFCadGKFUc_s6x3qNX8F4jsVawkzVg",
    authDomain:"redsracing-a7f8b.firebaseapp.com",
    projectId:"redsracing-a7f8b",
    storageBucket:"redsracing-a7f8b.firebasestorage.app",
    messagingSenderId:"517034606151",
    appId:"1:517034606151:web:24cae262e1d98832757b62"
  });
  var db   = firebase.firestore();
  var auth = firebase.auth();

  var path   = window.location.pathname;
  var raceId = path.replace(/^\/passport\/?/, '') || new URLSearchParams(window.location.search).get('raceId') || '';
  if (raceId === 'passport.html' || raceId.indexOf('.html') !== -1) raceId = new URLSearchParams(window.location.search).get('raceId') || '';

  function escHtml(s){
    return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
  }

  function showResult(type, html){
    var el = document.getElementById('result-area');
    if (el) el.innerHTML = '<div class="result ' + type + '">' + html + '</div>';
  }

  function badgesForCount(n){
    var out = [];
    if (n >= 1) out.push('First Stamp');
    if (n >= 3) out.push('Regular');
    if (n >= 5) out.push('Track Rat');
    if (n >= 10) out.push('Superfan');
    return out;
  }

  function renderBadges(n){
    var row = document.getElementById('badge-row');
    if (!row) return;
    var b = badgesForCount(n);
    row.innerHTML = b.length ? b.map(function(x){ return '<span class="badge">'+escHtml(x)+'</span>'; }).join('') : '<span class="badge" style="opacity:.6">No badges yet</span>';
  }

  function loadAlbum(user){
    var grid = document.getElementById('album-grid');
    if (!grid) return;
    if (!user) {
      grid.innerHTML = '<div class="sub">Sign in to unlock your stamp album.</div>';
      renderBadges(0);
      return;
    }
    grid.innerHTML = '<div class="sub"><i class="fas fa-spinner fa-spin"></i> Loading album…</div>';
    Promise.all([
      db.collection('users').doc(user.uid).collection('passport_stamps').get(),
      db.collection('races').where('season','==',2026).orderBy('date','asc').get().catch(function(){ return { docs: [] }; })
    ]).then(function(pair){
      var stamps = {};
      pair[0].forEach(function(d){ stamps[d.id] = d.data() || {}; });
      var races = pair[1].docs || [];
      var count = Object.keys(stamps).length;
      renderBadges(count);
      document.getElementById('stamp-count').textContent = 'Your total stamps: ' + count;
      // Keep stampCount on user profile for homepage leaderboard widgets
      try { db.collection('users').doc(user.uid).set({ stampCount: count }, { merge: true }); } catch(_){}

      if (!races.length && !count) {
        grid.innerHTML = '<div class="sub">No races on the calendar yet. Stamps will show up here after check-in.</div>';
        return;
      }

      var html = '';
      if (races.length) {
        races.forEach(function(doc){
          var r = doc.data() || {};
          var earned = !!stamps[doc.id];
          var st = stamps[doc.id] || {};
          var when = '';
          try {
            if (st.ts && st.ts.toDate) when = st.ts.toDate().toLocaleDateString();
            else if (st.checkedInAt) when = new Date(st.checkedInAt).toLocaleDateString();
          } catch(_){}
          html += '<div class="stamp-tile'+(earned?' earned':'')+'">' +
            '<div class="ico">'+(earned?'✅':'⬜')+'</div>' +
            '<div class="name">'+escHtml(r.eventName||r.name||r.track||doc.id)+'</div>' +
            '<div class="meta">'+(earned ? ('Stamped ' + escHtml(when||'')) : escHtml(r.date||'Upcoming'))+'</div>' +
          '</div>';
        });
      } else {
        Object.keys(stamps).forEach(function(id){
          var st = stamps[id] || {};
          html += '<div class="stamp-tile earned"><div class="ico">✅</div><div class="name">'+escHtml(id)+'</div><div class="meta">Stamped</div></div>';
        });
      }
      grid.innerHTML = html;
    }).catch(function(e){
      console.warn(e);
      grid.innerHTML = '<div class="sub">Could not load stamp album.</div>';
    });
  }

  if (raceId) {
    document.getElementById('race-name').textContent = 'Race check-in: ' + decodeURIComponent(raceId);
    db.collection('races').doc(raceId).get().then(function(snap){
      if (snap.exists) {
        var r = snap.data() || {};
        document.getElementById('race-name').textContent = (r.eventName||r.name||r.track||raceId);
      }
    }).catch(function(){});
  } else {
    document.getElementById('race-name').textContent = 'Collect stamps at every race night';
    document.getElementById('checkin-card').querySelector('.stamp-icon').textContent = '📘';
  }

  auth.onAuthStateChanged(function(user){
    loadAlbum(user);
    if (!user) {
      document.getElementById('signin-prompt').style.display = 'block';
      document.getElementById('checkin-area').style.display = 'none';
      return;
    }
    document.getElementById('signin-prompt').style.display = 'none';
    if (!raceId) return;
    db.doc('users/' + user.uid + '/passport_stamps/' + raceId).get().then(function(snap){
      if (snap.exists) {
        var ts = snap.data().ts;
        var when = ts && ts.toMillis ? new Date(ts.toMillis()).toLocaleDateString() : '';
        showResult('success', '<i class="fas fa-check-circle"></i> Already stamped' + (when ? ' on ' + when : '') + '!');
      } else {
        document.getElementById('checkin-area').style.display = 'block';
      }
    }).catch(function(){ document.getElementById('checkin-area').style.display = 'block'; });
  });

  document.getElementById('checkin-btn').addEventListener('click', function(){
    var user = auth.currentUser;
    if (!user) { showResult('error', 'Please sign in first.'); return; }
    if (!raceId) { showResult('error', 'Missing race check-in link.'); return; }
    var btn = document.getElementById('checkin-btn');
    btn.disabled = true; btn.textContent = 'Checking in…';

    fetch('/passport/checkin?raceId=' + encodeURIComponent(raceId) + '&uid=' + encodeURIComponent(user.uid), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    }).then(function(r){ return r.json(); }).then(function(data){
      if (data.ok) {
        showResult('success', '<i class="fas fa-stamp"></i> Passport stamped! Welcome to ' + escHtml(data.track || raceId));
        document.getElementById('checkin-area').style.display = 'none';
        loadAlbum(user);
      } else {
        showResult('error', data.error || 'Check-in failed. Try again.');
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-passport"></i> Stamp My Passport!';
      }
    }).catch(function(){
      db.doc('users/' + user.uid + '/passport_stamps/' + raceId).set({
        raceId: raceId, ts: firebase.firestore.FieldValue.serverTimestamp(), checkedInAt: new Date().toISOString()
      }).then(function(){
        showResult('success', '<i class="fas fa-stamp"></i> Passport stamped!');
        document.getElementById('checkin-area').style.display = 'none';
        loadAlbum(user);
      }).catch(function(e2){ showResult('error', 'Error: ' + e2.message); btn.disabled = false; });
    });
  });
  </script>
</body>
</html>
