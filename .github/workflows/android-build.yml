name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        run: |
          FILE=android/app/build.gradle.kts
          VERSION_NAME=$(grep -E 'versionName[[:space:]]*=' "$FILE" | head -1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode[[:space:]]*=' "$FILE" | head -1 | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION_NAME (versionCode $VERSION_CODE)"

      # Optional: set repo secret GOOGLE_SERVICES_JSON to full JSON so CI/cloud never relies on a stale committed copy.
      - name: Inject google-services.json from secret (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Wrote android/app/google-services.json from GOOGLE_SERVICES_JSON secret."
          else
            echo "GOOGLE_SERVICES_JSON secret unset — using committed google-services.json."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks

      - name: Build Release Bundle
        env:
          REDSRACING_KEYSTORE_PASSWORD: ${{ secrets.REDSRACING_KEYSTORE_PASSWORD }}
          REDSRACING_KEY_PASSWORD: ${{ secrets.REDSRACING_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace -PREDSRACING_KEYSTORE_PASSWORD=$REDSRACING_KEYSTORE_PASSWORD -PREDSRACING_KEY_PASSWORD=$REDSRACING_KEY_PASSWORD

      - name: Upload to Google Play (Internal Testing)
        continue-on-error: true
        env:
          PLAYSTORE_DEPLOY_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        working-directory: android
        run: |
          if [ -z "$PLAYSTORE_DEPLOY_KEY" ]; then
            echo "⚠️ Google Play service account credentials not configured, skipping upload"
            exit 0
          fi
          
          # Create service account JSON file with absolute path
          SERVICE_ACCOUNT_FILE="$PWD/service-account.json"
          echo "$PLAYSTORE_DEPLOY_KEY" > "$SERVICE_ACCOUNT_FILE"
          
          # Upload to Google Play using Gradle Play Publisher plugin
          ./gradlew publishBundle \
            -Pplay.serviceAccountCredentials="$SERVICE_ACCOUNT_FILE" \
            --no-daemon \
            --stacktrace
          
          # Clean up service account file
          rm -f "$SERVICE_ACCOUNT_FILE"

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reds-racing-aab-v${{ steps.app_version.outputs.version_name }}-b${{ steps.app_version.outputs.version_code }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90
          if-no-files-found: error

      - name: Download instructions (job summary)
        run: |
          {
            echo "## Android App Bundle ready to download"
            echo ""
            echo "The signed **Play Store** bundle is published as a workflow artifact (a zip file)."
            echo ""
            echo "| | |"
            echo "|--|--|"
            echo "| **Artifact name** | \`reds-racing-aab-v${{ steps.app_version.outputs.version_name }}-b${{ steps.app_version.outputs.version_code }}\` |"
            echo "| **File inside zip** | \`app-release.aab\` |"
            echo ""
            echo "### How to download"
            echo "1. Open this workflow run in the **Actions** tab."
            echo "2. Scroll to **Artifacts** at the bottom of the page."
            echo "3. Download the artifact zip, extract it, and use \`app-release.aab\` in [Google Play Console](https://play.google.com/console)."
            echo ""
            echo "To trigger a fresh build manually: **Actions → Android Build → Run workflow**."
            echo ""
            echo "Workflow file: [\`android-build.yml\`](https://github.com/${{ github.repository }}/actions/workflows/android-build.yml)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keystore
        if: always()
        working-directory: android
        run: rm -f upload-keystore.jks
