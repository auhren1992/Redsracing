name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'assets/**'
      - 'styles/**'
      - 'data/**'
      - 'components/**'
      - '*.html'
      - 'navigation.js'
      - 'manifest.json'
      - 'site.webmanifest'
      - 'scripts/sync-mobile-www.mjs'
      - 'package.json'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

# Play Developer API allows only one active edit per package. Queue publishes
# so overlapping Android Build runs do not invalidate each other's edits mid-upload.
concurrency:
  group: android-play-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Sync website into Android assets
        run: npm run sync:mobile

      - name: Read app version
        id: app_version
        run: |
          FILE=android/app/build.gradle.kts
          VERSION_NAME=$(grep -E 'versionName[[:space:]]*=' "$FILE" | head -1 | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode[[:space:]]*=' "$FILE" | head -1 | sed -E 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION_NAME (versionCode $VERSION_CODE)"

      # Optional: set repo secret GOOGLE_SERVICES_JSON to full JSON so CI/cloud never relies on a stale committed copy.
      - name: Inject google-services.json from secret (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Wrote android/app/google-services.json from GOOGLE_SERVICES_JSON secret."
          else
            echo "GOOGLE_SERVICES_JSON secret unset — using committed google-services.json."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks

      - name: Build Release Bundle
        env:
          REDSRACING_KEYSTORE_PASSWORD: ${{ secrets.REDSRACING_KEYSTORE_PASSWORD }}
          REDSRACING_KEY_PASSWORD: ${{ secrets.REDSRACING_KEY_PASSWORD }}
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace -PREDSRACING_KEYSTORE_PASSWORD=$REDSRACING_KEYSTORE_PASSWORD -PREDSRACING_KEY_PASSWORD=$REDSRACING_KEY_PASSWORD 2>&1 | tee bundle-release.log || (echo "--- Last 100 lines ---"; tail -n 100 bundle-release.log; exit 1)

      - name: Upload to Google Play (closed testing / alpha track)
        env:
          # Triple-T gradle-play-publisher 3.x reads this env var (full JSON), not -Pplay.* alone.
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        working-directory: android
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_PUBLISHER_CREDENTIALS:-}" ]; then
            echo "⚠️ Google Play service account credentials not configured (add Actions secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON), skipping upload"
            exit 0
          fi
          # Safe debug: principal only (never log the private key).
          PRINCIPAL="$(printf '%s' "$ANDROID_PUBLISHER_CREDENTIALS" | jq -r '.client_email // empty' 2>/dev/null || true)"
          if [ -n "$PRINCIPAL" ]; then
            echo "Play Publisher principal: $PRINCIPAL (must have app-level release access for com.redsracing.app in Play Console)"
          else
            echo "⚠️ Could not read client_email from GOOGLE_PLAY_SERVICE_ACCOUNT_JSON — check JSON is valid."
          fi

          ARTIFACT_DIR="app/build/outputs/bundle/release"
          if ! ls "$ARTIFACT_DIR"/*.aab >/dev/null 2>&1; then
            echo "❌ No .aab found under $ARTIFACT_DIR — bundleRelease must succeed before publish."
            exit 1
          fi

          # Publish the already-built AAB only (no rebuild). Short edit window + retries
          # avoid Play API "This edit has expired/deleted" from concurrent edits.
          MAX_ATTEMPTS=3
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "Play publish attempt ${attempt}/${MAX_ATTEMPTS} (artifact-dir=${ARTIFACT_DIR})"
            set +e
            ./gradlew publishBundle --no-daemon --stacktrace \
              --artifact-dir "$ARTIFACT_DIR" 2>&1 | tee publish-bundle.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              echo "✅ Play publish succeeded on attempt ${attempt}"
              exit 0
            fi
            if grep -Eqi 'edit has expired|edit has been deleted|editDeleted|FAILED_PRECONDITION' publish-bundle.log \
              && [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep_s=$((attempt * 45))
              echo "⚠️ Transient Play edit conflict/expiry (attempt ${attempt}). Retrying in ${sleep_s}s…"
              sleep "$sleep_s"
              attempt=$((attempt + 1))
              continue
            fi
            echo "--- Last 100 lines of publish-bundle.log ---"
            tail -n 100 publish-bundle.log
            exit "$status"
          done

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reds-racing-aab-v${{ steps.app_version.outputs.version_name }}-b${{ steps.app_version.outputs.version_code }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90
          if-no-files-found: error

      - name: Download instructions (job summary)
        run: |
          {
            echo "## Android App Bundle ready to download"
            echo ""
            echo "The signed **Play Store** bundle is published as a workflow artifact (a zip file)."
            echo ""
            echo "| | |"
            echo "|--|--|"
            echo "| **Artifact name** | \`reds-racing-aab-v${{ steps.app_version.outputs.version_name }}-b${{ steps.app_version.outputs.version_code }}\` |"
            echo "| **File inside zip** | \`app-release.aab\` |"
            echo ""
            echo "### How to download"
            echo "1. Open this workflow run in the **Actions** tab."
            echo "2. Scroll to **Artifacts** at the bottom of the page."
            echo "3. Download the artifact zip, extract it, and use \`app-release.aab\` in [Google Play Console](https://play.google.com/console) if you need a manual upload."
            echo ""
            echo "When Play credentials are configured, CI also runs \`publishBundle --artifact-dir\` to the **closed testing** track (API track \`alpha\`), with retries on expired/deleted Play edits."
            echo ""
            echo "To trigger a fresh build manually: **Actions → Android Build → Run workflow**."
            echo ""
            echo "Workflow file: [\`android-build.yml\`](https://github.com/${{ github.repository }}/actions/workflows/android-build.yml)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keystore
        if: always()
        working-directory: android
        run: rm -f upload-keystore.jks
