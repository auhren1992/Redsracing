name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'assets/**'
      - 'styles/**'
      - 'data/**'
      - 'components/**'
      - '*.html'
      - 'navigation.js'
      - 'manifest.json'
      - 'site.webmanifest'
      - 'scripts/sync-mobile-www.mjs'
      - 'package.json'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync website into iOS bundle
        run: npm run sync:mobile

      # Optional: base64-encode GoogleService-Info.plist → IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64
      - name: Inject GoogleService-Info.plist from secret (optional)
        env:
          PLIST_B64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -n "${PLIST_B64:-}" ]; then
            echo "$PLIST_B64" | base64 -d > ios/RedsRacing/GoogleService-Info.plist
            echo "Wrote ios/RedsRacing/GoogleService-Info.plist from IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 secret."
          else
            echo "IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 unset — using committed plist."
          fi

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          # Apple now requires iOS 26 SDK+ for uploads.
          # Pin to an Xcode 26.x toolchain available on macos-26 runners.
          xcode-version: '26.2'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          pod install --repo-update

      - name: Boot iOS Simulator
        run: |
          xcrun simctl list runtimes
          RUNTIME=$(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*' | head -1)
          xcrun simctl create TestDevice "iPhone 15" "$RUNTIME" || true
          xcrun simctl boot TestDevice || true

      - name: Install Apple Certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          
          rm certificate.p12

      - name: Install Provisioning Profile
        env:
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_SRC="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/decoded-provisioning.plist"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_SRC"
          security cms -D -i "$PROFILE_SRC" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          # Xcode discovers profiles by UUID filename; manual archive needs the profile *Name* as specifier
          cp "$PROFILE_SRC" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "Installed provisioning profile: name=$PROFILE_NAME uuid=$PROFILE_UUID"

      - name: Clean Build Folder
        working-directory: ios
        run: |
          rm -rf build
          xcodebuild clean -workspace RedsRacing.xcworkspace -scheme RedsRacing

      - name: Build Signed Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: ios
        run: |
          set -e
          
          echo "Starting iOS build..."
          echo "Using provisioning profile name=$PROFILE_NAME uuid=$PROFILE_UUID team=$APPLE_TEAM_ID"
          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "ERROR: APPLE_TEAM_ID secret is empty — set it to your 10-character Apple Developer Team ID."
            exit 1
          fi
          if [ -z "${PROFILE_NAME:-}" ] || [ -z "${PROFILE_UUID:-}" ]; then
            echo "ERROR: Provisioning profile metadata missing — check APPLE_PROVISIONING_PROFILE_BASE64 secret."
            exit 1
          fi
          set +e
          xcodebuild -workspace RedsRacing.xcworkspace \
            -scheme RedsRacing \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$PWD/build/RedsRacing.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            2>&1 | tee "$PWD/build/archive.log"
          ARCHIVE_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$ARCHIVE_STATUS" -ne 0 ]; then
            echo "Build failed with exit code $ARCHIVE_STATUS"
            echo "=== archive.log (errors) ==="
            grep -E "error:|fatal error:|❌|BUILD FAILED|Code Sign error|Provisioning profile" "$PWD/build/archive.log" | tail -n 80 || tail -n 120 "$PWD/build/archive.log"
            echo "=== signing identities ==="
            security find-identity -v -p codesigning || true
            exit "$ARCHIVE_STATUS"
          fi
          
          echo "Archive created successfully:"
          ls -la "$PWD/build/RedsRacing.xcarchive"

      - name: Show effective iOS versions
        working-directory: ios
        run: |
          echo "Release build settings:"
          xcodebuild -workspace RedsRacing.xcworkspace \
            -scheme RedsRacing \
            -configuration Release \
            -showBuildSettings | grep -E "CURRENT_PROJECT_VERSION|MARKETING_VERSION"
          echo "Archived app Info.plist versions:"
          /usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleShortVersionString" "$PWD/build/RedsRacing.xcarchive/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleVersion" "$PWD/build/RedsRacing.xcarchive/Info.plist"

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        working-directory: ios
        run: |
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.redsracing.app</key>
                  <string>$PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/RedsRacing.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$PWD/build/export"

      - name: Decode API Key
        id: decode_key
        run: |
          DECODED_KEY=$(echo "${{ secrets.ASC_API_KEY_BASE64 }}" | base64 --decode)
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "API_PRIVATE_KEY<<$EOF" >> $GITHUB_ENV
          echo "$DECODED_KEY" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: 'ios/build/export/RedsRacing.ipa'
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ env.API_PRIVATE_KEY }}

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/export/*.ipa
          retention-days: 30

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
