name: Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Hosting is static site files — no project npm ci required (lockfile sync
      # issues were blocking deploy). Install the CLI only.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.19.1

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_REDSRACING_A7F8B }}

      - name: Deploy Hosting
        run: firebase deploy --only hosting --project redsracing-a7f8b --non-interactive
